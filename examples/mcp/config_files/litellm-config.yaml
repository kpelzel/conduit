model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

mcp_servers:
  conduit_mcp:
    url: "https://mcp.home.arpa/mcp"
    transport: "http"
    auth_type: oauth2
    client_id: os.environ/MCP_CLIENT_ID
    client_secret: os.environ/MCP_CLIENT_SECRET
    token_url: "https://pocketid.home.arpa/api/oidc/token"
    scopes: ["profile"]

